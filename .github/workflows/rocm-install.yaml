name: recon-rocm-install

on:
  workflow_dispatch:

jobs:
  rocm-install:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 ROCm 6.4.3 用户态 (hipcc + 数学库)
        run: |
          set -e
          # AMD 官方 apt 源 (ROCm 6.4.3, ubuntu 24.04)
          wget -q https://repo.radeon.com/rocm/apt/6.4.3/key -O - | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] https://repo.radeon.com/rocm/apt/6.4.3 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -qq 2>&1 | tail -2
          # 只装编译 torch 需要的最小集
          sudo apt-get install -y -qq --no-install-recommends \
            rocm-dev hipblas hipblaslt-dev rocblas rocsolver miopen-hip \
            rccl hipsparse rocsolver-dev hipfft hipsolver 2>&1 | tail -3
          echo "=== hipcc ==="
          /opt/rocm/bin/hipcc --version 2>&1 | head -3
          echo "=== rocblas ==="
          ls /opt/rocm/lib/librocblas* 2>/dev/null | head -2
          echo "=== 磁盘剩余 ==="
          df -h / | tail -1
      - name: 编译冒烟测试 (gfx803 codegen)
        run: |
          cat > /tmp/hello.cpp <<'EOF'
          #include <hip/hip_runtime.h>
          __global__ void k(float* o) { o[0] = threadIdx.x; }
          int main() { return 0; }
          EOF
          /opt/rocm/bin/hipcc --offload-arch=gfx803 -c /tmp/hello.cpp -o /tmp/hello.o && echo "gfx803 codegen OK"
