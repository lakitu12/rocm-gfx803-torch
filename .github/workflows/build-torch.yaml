name: build-torch-gfx803

on:
  workflow_dispatch:
    inputs:
      rocm_release:
        description: 'GitHub Release 名 (ROCm 分卷包)'
        required: false
        default: 'rocm-6.4.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载并解压 ROCm 6.4.3 分卷
        run: |
          set -e
          # 从 GitHub Release 下载分卷 (rocm-6.4.3.part.NN.zst)
          RELEASE="${{ github.event.inputs.rocm_release }}"
          gh release download "$RELEASE" --repo ${{ github.repository }} --pattern 'rocm-6.4.3.part.*' --dir /tmp/rocm-parts
          ls -la /tmp/rocm-parts
          # 合并并解压到 /opt
          cat /tmp/rocm-parts/rocm-6.4.3.part.* > /tmp/rocm-6.4.3.tar.zst
          sudo mkdir -p /opt
          sudo tar --zstd -xf /tmp/rocm-6.4.3.tar.zst -C /opt
          # kineto 的 roctracer 硬编码 -I/opt/rocm/include/roctracer (ROCm 默认安装路径),
          # 必须有 /opt/rocm 软链接(本机 /opt/rocm -> /opt/rocm-6.4.3 同理)
          sudo ln -sfn /opt/rocm-6.4.3 /opt/rocm
          ls /opt/rocm/include/roctracer/roctracer.h >/dev/null && echo "roctracer.h OK"
          ls /opt/rocm-6.4.3/bin/hipcc && echo "ROCm 解压 OK"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 准备构建环境 (python + pytorch 依赖)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake libopenmpi-dev libomp-dev libnuma-dev \
            libgoogle-glog-dev libgflags-dev libpng-dev libjpeg-dev libsqlite3-dev \
            python3-dev python3-pip
          pip3 install -q --break-system-packages \
            typing-extensions sympy networkx jinja2 fsspec filelock packaging \
            pyyaml numpy pillow requests setuptools wheel
          echo "PATH=/opt/rocm-6.4.3/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: checkout pytorch 2.8 (8d1791e)
        run: |
          git clone --depth 1 https://github.com/pytorch/pytorch.git /tmp/pytorch
          cd /tmp/pytorch
          git fetch --depth 1 origin 8d1791e19169b3bb2b80357306ba1a22428abe38
          git checkout FETCH_HEAD
          git submodule sync
          git submodule update --init --recursive --depth 1 2>&1 | tail -3

      - name: 应用 gfx803 wave64 修复 (C10_WARP_SIZE)
        run: |
          cd /tmp/pytorch
          grep -n "defined(__GFX9__)" c10/macros/Macros.h | head -2
          # 修复: GCN 全系列 (GFX7/8/9) 都是 wave64, 只有 RDNA (GFX10/11) 是 wave32
          python3 - <<'EOF'
          import re
          p = 'c10/macros/Macros.h'
          s = open(p).read()
          old = '#if defined(__GFX9__)'
          new = '#if defined(__GFX7__) || defined(__GFX8__) || defined(__GFX9__)'
          assert old in s, "Macros.h 结构不符预期!"
          s = s.replace(old, new)
          open(p, 'w').write(s)
          print("patch applied")
          EOF
          grep -n -A3 "defined(__GFX7__)" c10/macros/Macros.h | head -6

      - name: hipify (生成 c10/hip、aten/src/THH 等 ROCm 源)
        run: |
          cd /tmp/pytorch
          # PyTorch 的 hip 目录(c10/hip、aten/src/THH、HIPConfig.h.in)不是仓库文件,
          # 由 tools/amd_build/build_amd.py 从 cuda 源转换生成。官方 .ci/pytorch/build.sh
          # 在 configure 之前调用它。纯 Python, 无 GPU 需求。
          python3 tools/amd_build/build_amd.py > /tmp/hipify.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== hipify exit: $EC ==="
          tail -5 /tmp/hipify.log
          echo "=== 关键生成文件检查 ==="
          ls -la c10/hip/impl/hip_cmake_macros.h.in 2>&1 | head -1
          ls -la aten/src/ATen/hip/HIPConfig.h.in 2>&1 | head -1
          ls -d aten/src/THH c10/hip/test 2>&1 | head -2
          exit $EC

      - name: CMake configure (out-of-source, setup.py 同款参数)
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm-6.4.3/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm-6.4.3
          export USE_NCCL=0 USE_DISTRIBUTED=0
          # 预配置到 setup.py 期望的 build/ 目录 (cache 存在则 setup.py 跳过 configure)
          rm -rf build && mkdir -p build
          set -o pipefail
          # 注意: run: 默认 bash -e, cmake 失败会直接杀掉 shell, 必须用 if/|| 捕获
          cmake -S /tmp/pytorch -B /tmp/pytorch/build -GNinja \
            -DBUILD_PYTHON=True -DBUILD_TEST=True -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/pytorch/torch \
            -DCMAKE_PREFIX_PATH=/usr/local/lib/python3.12/dist-packages \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DTORCH_BUILD_VERSION=2.8.0+git8d1791e \
            -DUSE_DISTRIBUTED=0 -DUSE_NCCL=0 -DUSE_NUMPY=True \
            > /tmp/cmake.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== CMake exit: $EC ==="
          wc -l /tmp/cmake.log
          echo "=== CMake Error 段 ==="
          grep -n -B5 -A25 "CMake Error" /tmp/cmake.log | head -120 || true
          echo "=== 尾部 40 行 ==="
          tail -40 /tmp/cmake.log
          if [ "$EC" = "0" ]; then
            ls /tmp/pytorch/build/CMakeCache.txt && ls /tmp/pytorch/build/build.ninja && echo "CONFIGURE OK"
          fi
          exit $EC

      - name: 上传 cmake 日志 (总是上传)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log
          path: /tmp/cmake.log
          retention-days: 30

      - name: 编译 torch (gfx803)
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm-6.4.3/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm-6.4.3
          export MAX_JOBS=4
          export USE_NCCL=0 USE_DISTRIBUTED=0
          set -o pipefail
          # bash -e 下用 || 捕获, 否则失败时错误段打印不出来
          python3 setup.py bdist_wheel > /tmp/build.log 2>&1 || EC=$?
          EC=${EC:-0}
          tail -40 /tmp/build.log
          echo "=== 构建日志错误段 ==="
          grep -iE "error|failed|not found" /tmp/build.log | tail -40 || true
          exit $EC

      - name: 上传 wheel
        uses: actions/upload-artifact@v4
        with:
          name: torch-2.8.0-gfx803
          path: /tmp/pytorch/dist/*.whl
          retention-days: 30