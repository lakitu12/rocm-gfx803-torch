name: build-torch-gfx803

on:
  workflow_dispatch:
    inputs:
      rocm_release:
        description: 'GitHub Release 名 (ROCm 分卷包)'
        required: false
        default: 'rocm-6.4.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载并解压 ROCm 6.4.3 分卷
        run: |
          set -e
          # 从 GitHub Release 下载分卷 (rocm-6.4.3.part.NN.zst)
          RELEASE="${{ github.event.inputs.rocm_release }}"
          gh release download "$RELEASE" --repo ${{ github.repository }} --pattern 'rocm-6.4.3.part.*' --dir /tmp/rocm-parts
          ls -la /tmp/rocm-parts
          # 合并并解压到 /opt
          cat /tmp/rocm-parts/rocm-6.4.3.part.* > /tmp/rocm-6.4.3.tar.zst
          sudo mkdir -p /opt
          sudo tar --zstd -xf /tmp/rocm-6.4.3.tar.zst -C /opt
          # kineto 的 roctracer 硬编码 -I/opt/rocm/include/roctracer (ROCm 默认安装路径),
          # 必须有 /opt/rocm 软链接(本机 /opt/rocm -> /opt/rocm-6.4.3 同理)
          sudo ln -sfn /opt/rocm-6.4.3 /opt/rocm
          ls /opt/rocm/include/roctracer/roctracer.h >/dev/null && echo "roctracer.h OK"
          ls /opt/rocm-6.4.3/bin/hipcc && echo "ROCm 解压 OK"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 准备构建环境 (python + pytorch 依赖)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake libopenmpi-dev libomp-dev libnuma-dev \
            libgoogle-glog-dev libgflags-dev libpng-dev libjpeg-dev libsqlite3-dev \
            python3-dev python3-pip
          pip3 install -q --break-system-packages \
            typing-extensions sympy networkx jinja2 fsspec filelock packaging \
            pyyaml numpy pillow requests setuptools wheel
          echo "PATH=/opt/rocm-6.4.3/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: checkout pytorch 2.8 (8d1791e)
        run: |
          git clone --depth 1 https://github.com/pytorch/pytorch.git /tmp/pytorch
          cd /tmp/pytorch
          git fetch --depth 1 origin 8d1791e19169b3bb2b80357306ba1a22428abe38
          git checkout FETCH_HEAD
          git submodule sync
          git submodule update --init --recursive --depth 1 2>&1 | tail -3

      - name: 应用 gfx803 wave64 修复 (C10_WARP_SIZE)
        run: |
          cd /tmp/pytorch
          grep -n "defined(__GFX9__)" c10/macros/Macros.h | head -2
          # 修复: GCN 全系列 (GFX7/8/9) 都是 wave64, 只有 RDNA (GFX10/11) 是 wave32
          python3 - <<'EOF'
          import re
          p = 'c10/macros/Macros.h'
          s = open(p).read()
          old = '#if defined(__GFX9__)'
          new = '#if defined(__GFX7__) || defined(__GFX8__) || defined(__GFX9__)'
          assert old in s, "Macros.h 结构不符预期!"
          s = s.replace(old, new)
          open(p, 'w').write(s)
          print("patch applied")
          EOF
          grep -n -A3 "defined(__GFX7__)" c10/macros/Macros.h | head -6

      - name: hipify (生成 c10/hip、aten/src/THH 等 ROCm 源)
        run: |
          cd /tmp/pytorch
          # PyTorch 的 hip 目录(c10/hip、aten/src/THH、HIPConfig.h.in)不是仓库文件,
          # 由 tools/amd_build/build_amd.py 从 cuda 源转换生成。官方 .ci/pytorch/build.sh
          # 在 configure 之前调用它。纯 Python, 无 GPU 需求。
          python3 tools/amd_build/build_amd.py > /tmp/hipify.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== hipify exit: $EC ==="
          tail -5 /tmp/hipify.log
          echo "=== 关键生成文件检查 ==="
          ls -la c10/hip/impl/hip_cmake_macros.h.in 2>&1 | head -1
          ls -la aten/src/ATen/hip/HIPConfig.h.in 2>&1 | head -1
          ls -d aten/src/THH c10/hip/test 2>&1 | head -2
          exit $EC

      - name: 去除 --offload-compress (gfx803 fatbin 修复)
        run: |
          cd /tmp/pytorch
          # gfx803 上 CCOB(压缩)fatbin 经 ld 拼接后 HIP 运行时解析失败
          # ("Cannot retrieve Static function" / invalid device function,
          #  影响 nonzero/masked_select 等 hipcub 内核)。非压缩
          # CLANG_OFFLOAD_BUNDLE 拼接后运行正常(已实测)。
          grep -n "offload-compress" cmake/Dependencies.cmake
          sed -i '/offload-compress/d' cmake/Dependencies.cmake
          grep -c "offload-compress" cmake/Dependencies.cmake || echo "PATCH_OK: --offload-compress 已移除"

      - name: hipcc 链接器 (gfx803 fatbin 注册修复, 唯一未试差异点)
        run: |
          # 背景 (2026-08-15 结论): HIP 运行时对 GNU ld 拼接的巨型 .hip_fatbin
          # (240 条目, 269MB 非压缩) 注册失败 "Cannot retrieve Static function,
          # error: 218" → nonzero/masked_select invalid device function。
          # 本地穷举编译 flags/条目数均无法复现; 唯一未试: 链接器走 hipcc
          # (clang driver) 而非默认 g++ (CMAKE_CXX_COMPILER)。
          # CMake 规则: Linux-GNU platform 在 enable_language 时才生成默认
          # rule 变量, -C 预载(enable_language 前)设置即可覆盖。
          cat > /tmp/hipcc-link.cmake <<'EOF'
          set(CMAKE_CXX_CREATE_SHARED_LIBRARY "hipcc <CMAKE_SHARED_LIBRARY_CXX_FLAGS> <LINK_FLAGS> <CMAKE_SHARED_LIBRARY_CREATE_CXX_FLAGS> <SONAME_FLAG><TARGET_SONAME> -o <TARGET> <OBJECTS> <LINK_LIBRARIES>")
          set(CMAKE_CXX_LINK_EXECUTABLE "hipcc <FLAGS> <CMAKE_CXX_LINK_FLAGS> <LINK_FLAGS> <OBJECTS> -o <TARGET> <LINK_LIBRARIES>")
          EOF
          echo "== hipcc-link.cmake =="
          cat /tmp/hipcc-link.cmake

      - name: CMake configure (out-of-source, setup.py 同款参数)
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm-6.4.3/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm-6.4.3
          export USE_NCCL=0 USE_DISTRIBUTED=0
          # 预配置到 setup.py 期望的 build/ 目录 (cache 存在则 setup.py 跳过 configure)
          rm -rf build && mkdir -p build
          set -o pipefail
          # 注意: run: 默认 bash -e, cmake 失败会直接杀掉 shell, 必须用 if/|| 捕获
          cmake -C /tmp/hipcc-link.cmake -S /tmp/pytorch -B /tmp/pytorch/build -GNinja \
            -DBUILD_PYTHON=True -DBUILD_TEST=True -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/pytorch/torch \
            -DCMAKE_PREFIX_PATH=/usr/local/lib/python3.12/dist-packages \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DTORCH_BUILD_VERSION=2.8.0+git8d1791e \
            -DUSE_DISTRIBUTED=0 -DUSE_NCCL=0 -DUSE_NUMPY=True \
            > /tmp/cmake.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== CMake exit: $EC ==="
          wc -l /tmp/cmake.log
          echo "=== CMake Error 段 ==="
          grep -n -B5 -A25 "CMake Error" /tmp/cmake.log | head -120 || true
          echo "=== 尾部 40 行 ==="
          tail -40 /tmp/cmake.log
          if [ "$EC" = "0" ]; then
            ls /tmp/pytorch/build/CMakeCache.txt && ls /tmp/pytorch/build/build.ninja && echo "CONFIGURE OK"
          fi
          exit $EC

      - name: 上传 cmake 日志 (总是上传)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log
          path: /tmp/cmake.log
          retention-days: 30

      - name: 生成 codegen 头文件 (TensorBody.h 等)
        run: |
          cd /tmp/pytorch/build
          ninja ATEN_CPU_FILES_GEN_TARGET ATEN_CUDA_FILES_GEN_TARGET 2>&1 | tail -3
          ls aten/src/ATen/core/TensorBody.h && echo "CODEGEN OK"

      - name: 单独编译 Nonzero.hip (诊断 kernel codegen)
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm-6.4.3/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH
          set -o pipefail
          hipcc --offload-arch=gfx803 \
            -I/tmp/pytorch -I/tmp/pytorch/build -I/tmp/pytorch/build/aten/src \
            -I/tmp/pytorch/build/c10 -I/tmp/pytorch/aten/src \
            -I/opt/rocm-6.4.3/include \
            -DUSE_ROCM -D__HIP_PLATFORM_AMD__=1 -D__HIP_NO_HALF_OPERATORS__=1 \
            -D__HIP_NO_HALF_CONVERSIONS__=1 -DTORCH_HIP_VERSION=604 -DCAFFE2_USE_MIOPEN \
            -DTHRUST_DEVICE_SYSTEM=THRUST_DEVICE_SYSTEM_HIP -DHIPBLAS_V2 \
            -DHIP_ENABLE_WARP_SYNC_BUILTINS -std=c++17 -O2 \
            -c aten/src/ATen/native/hip/Nonzero.hip -o /tmp/Nonzero_diag.o 2>&1 | tee /tmp/nonzero_diag.log | tail -20 || EC=$?
          EC=${EC:-0}
          echo "=== nonzero_diag exit: $EC ==="
          if [ "$EC" = "0" ]; then
            echo "=== kernel 符号计数 ==="
            objcopy --dump-section .hip_fatbin=/tmp/nz_diag_fatbin.bin /tmp/Nonzero_diag.o
            echo "fatbin kernel strings: $(strings /tmp/nz_diag_fatbin.bin | grep -cE 'flag_kernel|write_indices|compute_agg')"
          fi
          exit $EC

      - name: 上传 Nonzero 诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonzero-diagnostic
          path: |
            /tmp/Nonzero_diag.o
            /tmp/nz_diag_fatbin.bin
            /tmp/nonzero_diag.log
          retention-days: 30

      - name: 上传 build.ninja (真实编译命令)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ninja
          path: /tmp/pytorch/build/build.ninja
          retention-days: 30

      - name: 编译 torch (gfx803)
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm-6.4.3/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm-6.4.3/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm-6.4.3
          export MAX_JOBS=4
          export USE_NCCL=0 USE_DISTRIBUTED=0
          set -o pipefail
          # bash -e 下用 || 捕获, 否则失败时错误段打印不出来
          python3 setup.py bdist_wheel > /tmp/build.log 2>&1 || EC=$?
          EC=${EC:-0}
          tail -40 /tmp/build.log
          echo "=== 构建日志错误段 ==="
          grep -iE "error|failed|not found" /tmp/build.log | tail -40 || true
          exit $EC

      - name: 产物自检 (链接器确认 + fatbin kernel 检查)
        if: always()
        run: |
          set -e
          WHEEL=$(ls /tmp/pytorch/dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then echo "NO_WHEEL, skip"; exit 0; fi
          echo "wheel: $WHEEL"
          cd /tmp && rm -rf whlcheck && mkdir whlcheck && cd whlcheck
          unzip -q "$WHEEL"
          SO=$(find . -name "libtorch_hip*.so" | head -1)
          echo "so: $SO"
          ls -la "$SO"
          # 链接器确认: hipcc 链接的产物中应包含 clang/LLVM 版本字符串
          strings "$SO" | grep -m2 -iE "clang version|LLVM" || echo "no clang marker (可能仍是 g++ 链接)"
          # fatbin 段大小
          objdump -h "$SO" | grep -E "hip_fatbin|hipFatBin"
          # nonzero 族 kernel 是否在 fatbin 中 (非压缩产物可直接 strings)
          strings "$SO" | grep -cE "flag_kernel|write_indices|compute_agg|NonZeroOp" || echo "kernel strings 0 (压缩? 需本地解 CCOB)"
        env:
          PATH: /opt/rocm-6.4.3/bin:$PATH

      - name: 上传 wheel
        uses: actions/upload-artifact@v4
        with:
          name: torch-2.8.0-gfx803
          path: /tmp/pytorch/dist/*.whl
          retention-days: 30