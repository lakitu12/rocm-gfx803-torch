name: build-torch-gfx803-rocm10

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: 'ROCm 版本 (stable.repo.amd.com tarball)'
        required: false
        default: '10.0.0'
      torch_tag:
        description: 'PyTorch tag'
        required: false
        default: 'v2.13.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载并解压 ROCm 10.0.0 官方 tarball
        run: |
          set -e
          VER="${{ github.event.inputs.rocm_version }}"
          curl -sSL --retry 3 -o /tmp/rocm.tar.gz \
            "https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-${VER}.tar.gz"
          stat -c%s /tmp/rocm.tar.gz
          sudo mkdir -p /opt/rocm-${VER}
          sudo tar -x -f /tmp/rocm.tar.gz -C /opt/rocm-${VER} --strip-components=1
          # kineto roctracer 硬编码 -I/opt/rocm/include/roctracer
          sudo ln -sfn /opt/rocm-${VER} /opt/rocm
          ls /opt/rocm/include/roctracer/roctracer.h >/dev/null && echo "roctracer.h OK"
          /opt/rocm/bin/hipcc --version | head -2 && echo "ROCm 解压 OK"

      - name: 准备构建环境
        run: |
          set -e
          sudo apt-get update -qq
          # rocm_smi-config.cmake 现在 pkg_check_modules(libdrm REQUIRED)
          sudo apt-get install -y -qq ninja-build cmake libopenmpi-dev libomp-dev libnuma-dev \
            libgoogle-glog-dev libgflags-dev libpng-dev libjpeg-dev libsqlite3-dev \
            libdrm-dev python3-dev python3-pip
          # 坑4复刻: apt 依赖拖进 Ubuntu 旧版 libhsa-runtime64(5.7.1, 仅258个ROCR_1符号),
          # ROCm 10 libamdhip64.so.7 需要281个。链接测试/可执行文件时
          # -Wl,-rpath-link,/usr/lib/x86_64-linux-gnu 优先于 -L/opt/rocm/lib 命中旧版
          # → undefined reference to `hsa_*@ROCR_1` → ninja -k 1 进 drain 烧光剩余时间。
          # 本机同款修法: 移开系统版让 ld.so 落到 /opt/rocm/lib (run 36838507186 实证)。
          for f in /usr/lib/x86_64-linux-gnu/libhsa-runtime64.so*; do
            [ -e "$f" ] && sudo mv "$f" "$f.bak-ubuntu" || true
          done
          ls /usr/lib/x86_64-linux-gnu/libhsa-runtime64.so* 2>/dev/null | grep -v '\.bak-' \
            && echo "WARN: 系统 libhsa 仍在" || echo "system libhsa removed OK"
          # 硬验证: 复刻死亡现场链接方式 —— -rpath-link 指旧目录、仅 -L/opt/rocm/lib,
          # 期望 ld 不再报 hsa 符号、ldd 落到 /opt/rocm/lib
          echo 'int main(){return 0;}' > /tmp/hsacheck.c
          gcc /tmp/hsacheck.c -o /tmp/hsacheck -L/opt/rocm/lib -lamdhip64 \
            -Wl,-rpath-link,/usr/lib/x86_64-linux-gnu -Wl,-rpath,/opt/rocm/lib
          ldd /tmp/hsacheck | grep -F "libhsa-runtime64" || { echo "WARN: probe ldd 无 libhsa"; true; }
          # Ubuntu runner pip 装的是新 setuptools, bdist_wheel 命令在独立 wheel 包里
          # --no-isolation 要求 build-system.requires 预装 (scikit-build-core>=1.0, six)
          # packaging>=24.2 是 2.14 build-system.requires 硬要求 (runner 系统版 24.0 会 Unmet)
          pip3 install -q --break-system-packages \
            "setuptools<71" wheel build "scikit-build-core>=1.0" "packaging>=24.2" six \
            typing-extensions sympy networkx jinja2 fsspec filelock \
            pyyaml numpy pillow requests tomli
          echo "PATH=/opt/rocm/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: 加 swap (防巨型 HIP TU / autograd 绑定 OOM 暴死 runner)
        run: |
          set -e
          # 2.14 TensorTopK 峰值足迹 ~18.6G + torch_python python_functions_*.cpp
          # 单文件 4-8G, 16G runner 上 4 并发必被 OOM killer 连 runner 一起杀
          # (表现为 lost communication, 不是编译错误)。runner 有 sudo, 资源盘建 swap。
          free -m | head -2
          # 镜像自带 /mnt/swapfile(临时盘)时先卸再重建, 避免 EEXIST/swapon busy
          sudo swapoff /mnt/swapfile 2>/dev/null || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=24576
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "=== swap on ==="; free -m | head -3
          cat /proc/swaps

      - name: checkout pytorch ${{ github.event.inputs.torch_tag }}
        run: |
          set -e
          TAG="${{ github.event.inputs.torch_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/pytorch/pytorch.git /tmp/pytorch
          cd /tmp/pytorch
          git submodule sync
          git submodule update --init --recursive --depth 1 > /tmp/submodule.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "submodule exit: $EC"
          tail -3 /tmp/submodule.log
          # 关键 submodule 文件验证 (被 tail 吞错的教训)
          # 注意: 2.14+ kineto 已无 RoctracerActivityApi.cpp (迁 rocprofiler-sdk),
          # 只查目录非空; /opt/rocm 软链照建不误 (hip 头/库路径仍被别处引用)
          test -d third_party/kineto/libkineto
          ls third_party/kineto/libkineto/src | head -1 >/dev/null
          [ -n "$(ls -A third_party/composable_kernel)" ] || [ ! -d third_party/composable_kernel ]
          exit $EC

      - name: 应用 gfx803 wave64 修复 (2.13 headeronly 新路径)
        run: |
          set -e
          cd /tmp/pytorch
          # 2.13 起宏在 torch/headeronly/macros/Macros.h (c10/macros/Macros.h 已变转发头)
          # GCN 全系列 (GFX7/8/9) wave64, 仅 RDNA (GFX10+) wave32
          grep -n "defined(__GFX9__)" torch/headeronly/macros/Macros.h | head -4
          python3 - <<'EOF'
          p = 'torch/headeronly/macros/Macros.h'
          s = open(p).read()
          old = '#if defined(__GFX9__)'
          new = '#if defined(__GFX7__) || defined(__GFX8__) || defined(__GFX9__)'
          assert old in s, "Macros.h 结构不符预期!"
          s = s.replace(old, new)
          old2 = '#elif defined(__GFX9__)'
          new2 = '#elif defined(__GFX7__) || defined(__GFX8__) || defined(__GFX9__)'
          assert old2 in s, "LOWER/UPPER_BOUND 段不符预期!"
          s = s.replace(old2, new2)
          open(p, 'w').write(s)
          print("wave64 patch applied (2 sites)")
          EOF
          grep -n -A1 "defined(__GFX7__)" torch/headeronly/macros/Macros.h | head -6

      - name: 去除 --offload-compress (gfx803 fatbin 修复)
        run: |
          set -e
          cd /tmp/pytorch
          # gfx803 上压缩 fatbin 经 ld 拼接后 HIP 运行时解析失败 (error 218)
          grep -n "offload-compress" cmake/Dependencies.cmake
          sed -i 's/ --offload-compress//' cmake/Dependencies.cmake
          grep -c "offload-compress" cmake/Dependencies.cmake || echo "PATCH_OK"

      - name: ck_gemm 补 ROCm include (thrust 解析修复)
        run: |
          set -e
          cd /tmp/pytorch
          # 2.14 把 bgemm 拆成独立 ck_gemm target, 它不链 hip::device, 丢掉了
          # -isystem ${ROCM_PATH}/include → <thrust> 解析不到 ROCm 版。
          # 实测 target_include_directories 追加会被 Ninja 生成器对 HIP 对象吞掉
          # (INCLUDES 不含), 故走 target_compile_options 的 FLAGS 通道。
          python3 - <<'EOF'
          p = 'aten/src/ATen/CMakeLists.txt'
          s = open(p).read()
          anchor = '    target_compile_options(ck_gemm PRIVATE ${HIP_CXX_FLAGS})\n'
          add = anchor + '    target_compile_options(ck_gemm PRIVATE -isystem /opt/rocm/include)\n'
          assert anchor in s, "ck_gemm 锚点不符预期!"
          if '-isystem /opt/rocm/include' not in s:
              s = s.replace(anchor, add, 1)
              open(p, 'w').write(s)
              print("ck_gemm include patch applied")
          else:
              print("already patched")
          EOF
          grep -n "isystem /opt/rocm/include" aten/src/ATen/CMakeLists.txt

      - name: TensorTopK 巨型 TU 降为 -O0 (16G runner 内存墙)
        run: |
          set -e
          cd /tmp/pytorch
          # run 37214177594 实证: 3075/3082 后 110min 零进度 = TensorTopK.hip 单进程
          # RSS 600MB→14.9G + swap 12.8G, 16G runner 上 solo 也装不下它的足迹。
          # clang 内存大头在优化pass(RA/展开/SLP); 对此 TU 降 -O0, 正确性不受影响,
          # topk 核性能损失在 590 上无关痛痒。源码属性排在 target 选项之后, 覆盖 -O3。
          python3 - <<'EOF'
          p = 'aten/src/ATen/CMakeLists.txt'
          block = (
              '\n# gfx803 CI patch: 巨型 HIP TU 降优化 (runner 16G 内存墙)\n'
              '# run 37214177594: 3075/3082 后 solo thrash 110min, RSS 峰值 14.9G+swap12.8G。\n'
              '# -O0 砍掉优化pass内存大头(RA/展开), 正确性不变; clang 后者胜, 实测 -O0 覆盖 -O3。\n'
              '# property 按源码相对/绝对两种形态都挂一次, 保证匹配 ninja 实际路径。\n'
              'foreach(_fat native/hip/TensorTopK.hip)\n'
              '  if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/${_fat})\n'
              '    set_source_files_properties(${_fat} PROPERTIES COMPILE_OPTIONS "-O0")\n'
              '    set_source_files_properties(${CMAKE_CURRENT_SOURCE_DIR}/${_fat} PROPERTIES COMPILE_OPTIONS "-O0")\n'
              '    message(STATUS "FAT_TU_O0: ${_fat}")\n'
              '  endif()\n'
              'endforeach()\n'
          )
          open(p, 'a').write(block)
          print("TensorTopK -O0 property appended")
          EOF

      - name: hipify 生成 ROCm 源
        run: |
          cd /tmp/pytorch
          python3 tools/amd_build/build_amd.py > /tmp/hipify.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== hipify exit: $EC ==="
          tail -5 /tmp/hipify.log
          ls -la c10/hip/impl/hip_cmake_macros.h.in 2>&1 | head -1
          ls -la aten/src/ATen/hip/HIPConfig.h.in 2>&1 | head -1
          ls -d aten/src/THH c10/hip/test 2>&1 | head -2
          exit $EC

      - name: hipcc 链接器 (gfx803 fatbin 注册修复)
        run: |
          set -e
          cat > /tmp/hipcc-link.cmake <<'EOF'
          set(CMAKE_CXX_CREATE_SHARED_LIBRARY "hipcc <CMAKE_SHARED_LIBRARY_CXX_FLAGS> <LINK_FLAGS> <CMAKE_SHARED_LIBRARY_CREATE_CXX_FLAGS> <SONAME_FLAG><TARGET_SONAME> -o <TARGET> <OBJECTS> <LINK_LIBRARIES>")
          set(CMAKE_CXX_LINK_EXECUTABLE "hipcc <FLAGS> <CMAKE_CXX_LINK_FLAGS> <LINK_FLAGS> <OBJECTS> -o <TARGET> <LINK_LIBRARIES>")
          EOF
          cat /tmp/hipcc-link.cmake

      - name: CMake configure
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm
          export USE_NCCL=0 USE_DISTRIBUTED=0
          rm -rf build && mkdir -p build
          # BUILD_TEST=False: wheel 不含 gtest 测试二进制。run 36838507186 里
          # 3558 条边中 ~700 条是测试(编译+链接), 死亡链接错误(hsa@ROCR_1)正出在测试边;
          # 关掉后尾段大幅瘦身, 330min 预算可容纳。
          cmake -C /tmp/hipcc-link.cmake -S /tmp/pytorch -B /tmp/pytorch/build -GNinja \
            -DBUILD_PYTHON=True -DBUILD_TEST=False -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/pytorch/torch \
            -DCMAKE_PREFIX_PATH=/usr/local/lib/python3.12/dist-packages \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DTORCH_BUILD_VERSION=${{ github.event.inputs.torch_tag }}+rocm10.0.0.gfx803 \
            -DUSE_DISTRIBUTED=0 -DUSE_NCCL=0 -DUSE_NUMPY=True \
            > /tmp/cmake.log 2>&1 || EC=$?
          EC=${EC:-0}
          echo "=== CMake exit: $EC ==="
          grep -n -B5 -A25 "CMake Error" /tmp/cmake.log | head -120 || true
          tail -40 /tmp/cmake.log
          if [ "$EC" = "0" ]; then
            ls /tmp/pytorch/build/CMakeCache.txt && ls /tmp/pytorch/build/build.ninja && echo "CONFIGURE OK"
            # TensorTopK 必须带 -O0, 否则又是 solo thrash 烧满超时 —— 当场 fail 不等 5h
            grep -m1 "FAT_TU_O0" /tmp/cmake.log || { echo "FAT_TU_O0 未生效!"; exit 1; }
            # -C 必须在 -t 之前, 否则被当作子命令参数 (run 37257546507 假警报教训)
            ninja -C /tmp/pytorch/build -t commands caffe2/CMakeFiles/torch_hip.dir/__/aten/src/ATen/native/hip/TensorTopK.hip.o \
              | tail -1 | grep -q -- "-O0" || { echo "TensorTopK.o 命令不含 -O0!"; exit 1; }
            echo "TENSOR TOPK -O0 VERIFIED"
          fi
          exit $EC

      - name: 上传 cmake 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log
          path: /tmp/cmake.log
          retention-days: 30

      - name: 生成 codegen 头文件
        run: |
          set -e
          cd /tmp/pytorch/build
          ninja ATEN_CPU_FILES_GEN_TARGET ATEN_CUDA_FILES_GEN_TARGET 2>&1 | tail -3
          ls aten/src/ATen/core/TensorBody.h && echo "CODEGEN OK"

      - name: 编译 torch gfx803
        # 实测 200min 走完 3263/3558(含重尾); BUILD_TEST=False 砍掉测试边后 330 足够,
        # job 级 360min 上限内留上传余量
        timeout-minutes: 330
        run: |
          cd /tmp/pytorch
          export PATH=/opt/rocm/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rocm/lib:$LD_LIBRARY_PATH
          export PYTORCH_ROCM_ARCH=gfx803
          export ROCM_PATH=/opt/rocm
          export MAX_JOBS=3
          export USE_NCCL=0 USE_DISTRIBUTED=0
          # 进度 dump: runner 若再被 OOM 打死, GitHub 日志里至少留下
          # 案发现场(最后编译到哪个对象、内存水位、swap 用量)
          ( while sleep 120; do
              echo "--- $(date +%T) mem: $(free -m | awk 'NR==2{printf "%d/%dMB",$3,$2}') swap: $(free -m | awk 'NR==3{printf "%dMB",$3}') | $(grep -oE '\[[0-9]+/[0-9]+\]' /tmp/build.log 2>/dev/null | tail -1)"
              tail -1 /tmp/build.log 2>/dev/null | cut -c1-160
              ps -eo pid,etimes,rss,args --sort=-rss | grep "cc1" | grep -v grep | head -3 | awk '{printf "  top: %ds %dMB %s\n",$1,$3/1024,$NF}'
            done ) & DUMP=$!
          # v2.14+: setup.py bdist_wheel 已废弃 (scikit-build-core PEP517);
          # ≤2.13: 仍走 setup.py。按 torch_tag 分派。
          TAG="${{ github.event.inputs.torch_tag }}"
          MAJ=$(echo "$TAG" | sed 's/^v//;s/\..*//')
          MIN=$(echo "$TAG" | sed 's/^v[0-9]*\.//;s/[^0-9].*//')
          if [ "$MAJ" -eq 2 ] && [ "$MIN" -ge 14 ] 2>/dev/null; then
            # PEP517 不转发 -D 参数: 版本号/关键开关走 env (官方 build.sh 同款)
            export TORCH_BUILD_VERSION="${TAG}+rocm10.0.0.gfx803"
            # 预配置 build/ 保留 hipcc-link 与全部 -D 参数; SKB 会复用该 cache
            python3 -m build --wheel --no-isolation > /tmp/build.log 2>&1 || EC=$?
          else
            python3 setup.py bdist_wheel > /tmp/build.log 2>&1 || EC=$?
          fi
          kill $DUMP 2>/dev/null || true
          EC=${EC:-0}
          tail -40 /tmp/build.log
          echo "=== 构建日志错误段 ==="
          grep -n -i -B3 -A10 "error:" /tmp/build.log | head -100 || true
          if [ "$EC" = "0" ]; then
            ls -la dist/ && echo "WHEEL OK"
          fi
          exit $EC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 30

      - name: 验证 wheel 含 gfx803
        run: |
          set -e
          cd /tmp/pytorch/dist
          W=$(ls *.whl | head -1)
          unzip -o -q "$W" -d /tmp/wheel-extract 'torch/lib/libtorch_hip.so' || true
          echo "gfx803 strings: $(strings /tmp/wheel-extract/torch/lib/libtorch_hip.so | grep -c gfx803)"

      - name: 上传 wheel
        uses: actions/upload-artifact@v4
        with:
          name: torch-gfx803-rocm10-${{ github.event.inputs.torch_tag }}
          path: /tmp/pytorch/dist/*.whl
          retention-days: 30
